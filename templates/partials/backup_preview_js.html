<script>
(function() {
    const PREVIEW_URL = {{ url_for('api_backup_preview')|tojson }};
    const PROJECTS_URL = {{ url_for('api_backup_projects')|tojson }};

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    function getModal() {
        const modalEl = document.getElementById('backupPreviewModal');
        if (!modalEl) {
            alert('预览窗口未加载，请刷新页面后重试');
            return null;
        }
        if (typeof bootstrap === 'undefined') {
            alert('页面组件未就绪，请刷新页面后重试');
            return null;
        }
        return { el: modalEl, inst: bootstrap.Modal.getOrCreateInstance(modalEl) };
    }

    function renderCounts(counts) {
        if (!counts || !counts.length) return '<p class="text-muted">无业务数据</p>';
        let html = '<table class="table table-sm table-bordered mb-0"><thead><tr><th>数据类型</th><th class="text-end">条数</th></tr></thead><tbody>';
        counts.forEach(function(c) {
            html += '<tr><td>' + esc(c.label) + '</td><td class="text-end">' + c.count + '</td></tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function renderFilePreview(data) {
        let html = '<p class="mb-2">共 <strong>' + data.project_count + '</strong> 个项目';
        if (data.truncated) html += '（仅显示前 50 个）';
        html += '</p>';
        (data.projects || []).forEach(function(p) {
            html += '<div class="card mb-2"><div class="card-header py-2 small fw-semibold">#' + p.id + ' ' + esc(p.name) +
                ' <span class="badge bg-secondary">' + esc(p.status) + '</span> <span class="text-muted">合计约 ' + (p.total_rows || 0) + ' 条</span></div>' +
                '<div class="card-body py-2">' + renderCounts(p.counts) + '</div></div>';
        });
        return html;
    }

    function renderProjectPreview(data) {
        const p = data.project;
        let html = '<div class="alert alert-light border"><strong>' + esc(p.name) + '</strong> <span class="badge bg-secondary">' + esc(p.status) + '</span>';
        if (p.budget) html += ' · 预算 ' + p.budget;
        html += '<br><span class="text-muted small">备份中项目 ID：' + p.id + '，合计约 ' + (data.total_rows || 0) + ' 条业务记录</span></div>';
        html += renderCounts(data.counts);
        return html;
    }

    function parseJsonResponse(r) {
        const ct = (r.headers.get('content-type') || '').toLowerCase();
        if (!r.ok) {
            return r.text().then(function(t) {
                throw new Error('HTTP ' + r.status + (t ? '：' + t.slice(0, 120) : ''));
            });
        }
        if (ct.indexOf('application/json') >= 0) {
            return r.json();
        }
        return r.text().then(function(t) {
            throw new Error('服务器未返回 JSON（可能未登录或权限不足）');
        });
    }

    window.openBackupPreview = function(filename, projectId) {
        if (!filename) return;
        const m = getModal();
        if (!m) return;

        const loadingEl = document.getElementById('backupPreviewLoading');
        const errorEl = document.getElementById('backupPreviewError');
        const contentEl = document.getElementById('backupPreviewContent');
        const titleEl = document.getElementById('backupPreviewModalLabel');

        loadingEl.classList.remove('d-none');
        errorEl.classList.add('d-none');
        contentEl.innerHTML = '';
        titleEl.innerHTML = '<i class="bi bi-eye"></i> 预览：' + esc(filename) + (projectId ? ' / 项目 #' + projectId : '');
        m.inst.show();

        let url = PREVIEW_URL + '?filename=' + encodeURIComponent(filename);
        if (projectId) url += '&project_id=' + encodeURIComponent(projectId);

        fetch(url, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
            .then(parseJsonResponse)
            .then(function(res) {
                loadingEl.classList.add('d-none');
                if (!res.success) {
                    errorEl.textContent = res.message || '预览失败';
                    errorEl.classList.remove('d-none');
                    return;
                }
                const d = res.data;
                if (d.mode === 'file') contentEl.innerHTML = renderFilePreview(d);
                else if (d.mode === 'project') contentEl.innerHTML = renderProjectPreview(d);
                else contentEl.innerHTML = '<p class="text-muted">无预览数据</p>';
            })
            .catch(function(err) {
                loadingEl.classList.add('d-none');
                errorEl.textContent = '请求失败：' + (err.message || err);
                errorEl.classList.remove('d-none');
            });
    };

    window.loadBackupProjects = function(selectEl, filename) {
        if (!filename || !selectEl) return;
        selectEl.innerHTML = '<option value="">加载中…</option>';
        fetch(PROJECTS_URL + '?filename=' + encodeURIComponent(filename), {
            credentials: 'same-origin',
            headers: { 'Accept': 'application/json' }
        })
            .then(parseJsonResponse)
            .then(function(res) {
                if (!res.success) {
                    selectEl.innerHTML = '<option value="">加载失败：' + esc(res.message) + '</option>';
                    return;
                }
                let html = '<option value="">请选择源项目…</option>';
                (res.projects || []).forEach(function(p) {
                    html += '<option value="' + p.id + '">' + esc(p.name) + ' (' + esc(p.status) + ')</option>';
                });
                selectEl.innerHTML = html;
                selectEl.disabled = false;
            })
            .catch(function() {
                selectEl.innerHTML = '<option value="">加载失败</option>';
            });
    };
})();
</script>
