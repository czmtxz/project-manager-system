{# 备份数据预览弹窗（脚本见 backup_preview_js.html，须在 Bootstrap 之后加载） #}
<div class="modal fade" id="backupPreviewModal" tabindex="-1" aria-labelledby="backupPreviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="backupPreviewModalLabel">
                    <i class="bi bi-eye"></i> 备份数据预览
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="backupPreviewLoading" class="text-center py-4 text-muted d-none">
                    <div class="spinner-border spinner-border-sm"></div> 正在读取备份…
                </div>
                <div id="backupPreviewError" class="alert alert-danger d-none"></div>
                <div id="backupPreviewContent"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
